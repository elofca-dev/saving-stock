name: Fiyatları Güncelle

on:
  schedule:
    # Her 5 dakikada bir (GitHub'ın izin verdigi pratik alt sinir; yogunluga gore birkac dakika gecikebilir)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir
  push:
    branches: [main]
    paths:
      - fetch_prices.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install yfinance

      - name: Fiyatları çek
        run: python fetch_prices.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "altin-takip-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Fiyatları güncelle: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Değişiklik yok, commit atılmadı."
          fi
