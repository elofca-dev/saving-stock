name: Fiyatları Güncelle

on:
  schedule:
    # Her 5 dakikada bir (GitHub'ın izin verdigi pratik alt sinir; yogunluga gore birkac dakika gecikebilir)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir
  push:
    branches: [main]
    paths:
      - fetch_prices.py

permissions:
  contents: write

# Ayni anda birden fazla calisma (ornegin zamanlanan calisma ile push tetiklemesi
# ust uste binerse) ayni data.json'a paralel push denemesin diye siraya sokulur.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install yfinance

      - name: Fiyatları çek
        run: python fetch_prices.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "altin-takip-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Fiyatları güncelle: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # concurrency grubu ayni anda iki calismayi engeller, ama yine de
            # remote'ta yeni bir commit varsa (ornegin elle bir duzenleme)
            # rebase edip yeniden dene; boylece "rejected (fetch first)" hatasi
            # is akisini kirmaz.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push basarisiz, remote'u alip rebase ediliyor (deneme $i)..."
              git fetch origin main
              git rebase origin/main
              sleep $((i * 3))
            done
          else
            echo "Değişiklik yok, commit atılmadı."
          fi
